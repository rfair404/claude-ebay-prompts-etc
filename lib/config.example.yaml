# ebaybiz V2 — config.example.yaml
#
# Copy this file to:
#   Windows:        %APPDATA%\ebaybiz\config.yaml
#   macOS / Linux:  ~/.ebaybiz/config.yaml
#
# Then edit the values below. Every section is optional — missing values
# fall back to the corresponding environment variable, then to a built-in
# default where one exists.
#
# Precedence for any setting (highest wins):
#   1. Explicit function argument (in code)
#   2. Environment variable (when applicable)
#   3. This config file
#   4. Built-in default

# ---------------------------------------------------------------------------
# Apify — eBay sold-listings scraping backend (Source B of PRICE)
# ---------------------------------------------------------------------------
apify:
  # PRICE's default Stage B comp source (the un-gated direct-eBay sold path).
  # If you leave this unset, Stage B falls back to the Chrome browse path.
  # Get a token at: https://console.apify.com/account/integrations
  api_token: "apify_api_REPLACE_ME"

  # Optional. Which Apify Actor to call for eBay scraping.
  # Default: automation-lab/ebay-sold-scraper — pins a US residential proxy
  # so eBay returns USD natively (avoids the foreign-currency leak that
  # actors without proxy control suffer). Override only if you've vetted a
  # cleaner/cheaper alternative against the currency-leak validator.
  ebay_actor: "automation-lab/ebay-sold-scraper"

# ---------------------------------------------------------------------------
# Anthropic — Claude API (for IDENTIFY / INVESTIGATE / PRICE / CURATE)
# ---------------------------------------------------------------------------
anthropic:
  # Required for any function that calls Claude.
  # Get a key at: https://console.anthropic.com/settings/keys
  api_key: "sk-ant-REPLACE_ME"

# ---------------------------------------------------------------------------
# eBay Sell API — credentials for Function 6 (LIST/EDIT) + schema discovery
# ---------------------------------------------------------------------------
# Sandbox and Production are separate worlds with separate keysets. This
# config stores BOTH side by side; `environment` selects the active one —
# flip that single line to switch between testing and live.
#
# Per field:
#   app_id / cert_id / dev_id — your keyset (developer.ebay.com/my/keys).
#       dev_id IS required (photo upload uses the Trading API EPS endpoint).
#   redirect_uri — your RuName (developer.ebay.com Auth'n'Auth), for OAuth.
#   user_refresh_token — captured once per environment:
#       python ebay_client.py --user-consent-url
#       python ebay_client.py --exchange-code <code-from-callback>
#   merchant_location_key + *_policy_id — from your account; list them with:
#       python list_edit.py --setup-check
#
# Full runbook: lib/SETUP_EBAY_API.md
ebay:
  environment: "sandbox"   # active: sandbox | production

  sandbox:
    app_id: "SBX-app-id"
    cert_id: "SBX-cert-id"
    dev_id: "SBX-dev-id"
    redirect_uri: "SBX-RuName"
    user_refresh_token: null
    merchant_location_key: null
    fulfillment_policy_id: null          # default (ground) shipping policy
    fulfillment_policy_id_media: null    # optional: Media Mail policy; used for
                                         # books/sheet music/recordings/computer
                                         # media. NOT magazines/catalogs/any paper
                                         # with ads (DMM 173.4.2 excludes
                                         # periodicals) — those ship ground.
    fulfillment_policy_id_local_pickup: null  # optional: local-pickup-only policy;
                                         # used for ship-risky items (fragile/over-
                                         # sized) marked fulfillment_mode LOCAL_PICKUP.
                                         # Create via `--create-pickup-policy`.
    payment_policy_id: null
    payment_policy_id_auction: null      # optional: a payment policy with immediate
                                         # payment OFF; required for AUCTION offers
                                         # (eBay forbids immediate-pay on auctions).
                                         # Falls back to payment_policy_id if unset.
    return_policy_id: null               # for Top Rated Plus this must be a
                                         # 30-day-or-longer policy with
                                         # returnShippingCostPayer: SELLER.
                                         # See docs/top-rated-plus.md.

  production:
    app_id: "PRD-app-id"
    cert_id: "PRD-cert-id"
    dev_id: "PRD-dev-id"
    redirect_uri: "PRD-RuName"
    user_refresh_token: null
    merchant_location_key: null
    fulfillment_policy_id: null          # default (ground) shipping policy
    fulfillment_policy_id_media: null    # optional: Media Mail policy; used for
                                         # books/sheet music/recordings/computer
                                         # media. NOT magazines/catalogs/any paper
                                         # with ads (DMM 173.4.2 excludes
                                         # periodicals) — those ship ground.
    fulfillment_policy_id_local_pickup: null  # optional: local-pickup-only policy;
                                         # used for ship-risky items (fragile/over-
                                         # sized) marked fulfillment_mode LOCAL_PICKUP.
                                         # Create via `--create-pickup-policy`.
    payment_policy_id: null
    payment_policy_id_auction: null      # optional: a payment policy with immediate
                                         # payment OFF; required for AUCTION offers
                                         # (eBay forbids immediate-pay on auctions).
                                         # Falls back to payment_policy_id if unset.
    return_policy_id: null               # for Top Rated Plus this must be a
                                         # 30-day-or-longer policy with
                                         # returnShippingCostPayer: SELLER.
                                         # See docs/top-rated-plus.md.

# ---------------------------------------------------------------------------
# CURATE strategy profiles
# ---------------------------------------------------------------------------
# Profiles encode the Buy Point math used by CURATE. The active profile
# applies by default; named profiles can be selected per-run via CLI flag.
#
# Built-in defaults (applied to any profile that omits a field):
#   margin_target:        0.50    (50% — sell for at least 2x buy)
#   buy_point_multiplier: 0.5     (against worst-case sale floor)
#   fee_pct:              0.13    (eBay + payment processing)
#   profit_floor:         100     (USD per item minimum)
#   drive_cost:           0       (per-trip; only factored if set)

active_profile: "default"

profiles:
  default:
    margin_target: 0.50
    buy_point_multiplier: 0.5
    fee_pct: 0.13
    profit_floor: 100
    drive_cost: 0

  # Example: aggressive profile for in-person estate-sale buying within
  # ~25-mile drive radius. Tighter margin, lower floor, accounts for drive.
  estate-sale-25mi:
    margin_target: 0.40
    buy_point_multiplier: 0.45
    profit_floor: 75
    drive_cost: 15      # round-trip cost factored against potential profit

  # Example: online-pickup profile (no drive cost, conservative buy).
  online-no-pickup:
    margin_target: 0.50
    buy_point_multiplier: 0.4
    profit_floor: 100
    drive_cost: 0

  # Example: higher floor for slow-moving categories where you only want
  # high-margin items worth waiting for.
  high-floor:
    profit_floor: 200
    margin_target: 0.60

# ---------------------------------------------------------------------------
# Store identity + the standing close on every listing body.
#
# DRAFT renders `closing_block` VERBATIM as the last section of every
# description (see prompts/draft.md, "Markdown body"). It is boilerplate on
# purpose: a buyer reads it once, and it answers the questions that otherwise
# arrive as messages.
#
# Two rules. Nothing here may be a claim about the ITEM — this block is
# identical on every listing, so anything item-specific is false somewhere.
# And every line must be true of every listing you ship: if one stops being
# true, fix it HERE, never by editing it out of one listing.
#
# Note what is NOT in the default block: the "clean, smoke-free environment"
# line that most estate sellers carry. It is a factual claim about your
# premises. Add it only if it holds for everything you store and ship.
store:
  # The storefront name buyers see, used in the sign-off. Leave EMPTY and
  # DRAFT signs off with the unnamed thank-you rather than inventing a brand.
  display_name: ""

  closing_block: |
    Please message me with any questions before buying — I'd rather answer
    one than have you guess.

    Payment or contact is appreciated within three days so I can keep
    listings moving.

    Thank you for looking, and please take a look at my other listings.
