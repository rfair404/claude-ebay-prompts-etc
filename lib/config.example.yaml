# ebaybiz V2 — config.example.yaml
#
# Copy this file to:
#   Windows:        %APPDATA%\ebaybiz\config.yaml
#   macOS / Linux:  ~/.ebaybiz/config.yaml
#
# Then edit the values below. Every section is optional — missing values
# fall back to the corresponding environment variable, then to a built-in
# default where one exists.
#
# Precedence for any setting (highest wins):
#   1. Explicit function argument (in code)
#   2. Environment variable (when applicable)
#   3. This config file
#   4. Built-in default

# ---------------------------------------------------------------------------
# Apify — Google Lens reverse-image lookup (lib/lens_id.py). NOT a comp source.
# ---------------------------------------------------------------------------
apify:
  # Used ONLY by lib/lens_id.py — the Google Lens reverse-image lookup that
  # IDENTIFY can call for a visual second opinion. Apify is NOT a comp source:
  # PRICE Stage B runs through lib/ebay_sold_browse.py and the eBay actors were
  # retired 2026-08-15 (docs/archive/pricing-backend-issues.md). Leave the token
  # unset if you do not use the Lens lookup.
  # Get a token at: https://console.apify.com/account/integrations
  api_token: "apify_api_REPLACE_ME"

  # Optional. Which Apify Actor to call for the Lens lookup.
  # Default: borderline/google-lens.
  # lens_actor: "borderline/google-lens"

# ---------------------------------------------------------------------------
# Vision — pluggable high-resolution image inspector (lib/fine_inspect.py)
# ---------------------------------------------------------------------------
# For reads that are hard to get right from a normal photo pass: fine
# print, a raised/embossed maker's mark with no printed contrast to key
# off, a faint signature. IDENTIFY/PREP hand a tight crop straight to a
# dedicated vision model instead of guessing. Distinct from apify.* above:
# that's reverse-image SEARCH (what does this look like on the web); this
# is direct visual INSPECTION (what do these pixels actually say) — no
# public hosting involved.
#
# `backend` selects the engine; each backend gets its own sub-section
# below. Swapping engines later needs only a new backend class registered
# in lib/fine_inspect.py's BACKENDS dict, plus a config line here.
vision:
  backend: "gemini"

  gemini:
    # Get a key at https://aistudio.google.com/apikey
    api_key: "GEMINI_API_KEY_REPLACE_ME"
    # Optional. Defaults to lib/config.py's DEFAULT_GEMINI_MODEL.
    # model: "gemini-2.5-pro"

# ---------------------------------------------------------------------------
# eBay Sell API — credentials for Function 6 (LIST/EDIT) + schema discovery
# ---------------------------------------------------------------------------
# Sandbox and Production are separate worlds with separate keysets. This
# config stores BOTH side by side; `environment` selects the active one —
# flip that single line to switch between testing and live.
#
# Per field:
#   app_id / cert_id / dev_id — your keyset (developer.ebay.com/my/keys).
#       dev_id IS required (photo upload uses the Trading API EPS endpoint).
#   redirect_uri — your RuName (developer.ebay.com Auth'n'Auth), for OAuth.
#   user_refresh_token — captured once per environment:
#       python ebay_client.py --user-consent-url
#       python ebay_client.py --exchange-code <code-from-callback>
#   merchant_location_key + *_policy_id — from your account; list them with:
#       python list_edit.py --setup-check
#
# Full runbook: lib/SETUP_EBAY_API.md
ebay:
  environment: "sandbox"   # active: sandbox | production

  sandbox:
    app_id: "SBX-app-id"
    cert_id: "SBX-cert-id"
    dev_id: "SBX-dev-id"
    redirect_uri: "SBX-RuName"
    user_refresh_token: null
    merchant_location_key: null
    fulfillment_policy_id: null          # default (ground) shipping policy
    fulfillment_policy_id_media: null    # optional: Media Mail policy; used for
                                         # books/sheet music/recordings/computer
                                         # media. NOT magazines/catalogs/any paper
                                         # with ads (DMM 173.4.2 excludes
                                         # periodicals) — those ship ground.
    fulfillment_policy_id_local_pickup: null  # optional: local-pickup-only policy;
                                         # used for ship-risky items (fragile/over-
                                         # sized) marked fulfillment_mode LOCAL_PICKUP.
                                         # Create via `--create-pickup-policy`.
    fulfillment_policy_id_us_only: null  # optional but REQUIRED to list firearm
                                         # magazines/parts, body armor or night
                                         # vision: a policy whose shipToLocations
                                         # is US only. eBay refuses those publishes
                                         # (errorId 25019, ITAR Part 121) while a
                                         # listing is eBay-International-Shipping
                                         # eligible, and eIS eligibility comes from
                                         # shipToLocations "Worldwide" on the policy
                                         # — NOT from globalShipping and NOT from
                                         # the draft's shipping.international flag.
                                         # Routing is automatic; see lib/us_only.py.
    payment_policy_id: null
    payment_policy_id_auction: null      # optional: a payment policy with immediate
                                         # payment OFF; required for AUCTION offers
                                         # (eBay forbids immediate-pay on auctions).
                                         # Falls back to payment_policy_id if unset.
    return_policy_id: null               # for Top Rated Plus this must be a
                                         # 30-day-or-longer policy with
                                         # returnShippingCostPayer: SELLER.
                                         # See docs/top-rated-plus.md.

  production:
    app_id: "PRD-app-id"
    cert_id: "PRD-cert-id"
    dev_id: "PRD-dev-id"
    redirect_uri: "PRD-RuName"
    user_refresh_token: null
    merchant_location_key: null
    fulfillment_policy_id: null          # default (ground) shipping policy
    fulfillment_policy_id_media: null    # optional: Media Mail policy; used for
                                         # books/sheet music/recordings/computer
                                         # media. NOT magazines/catalogs/any paper
                                         # with ads (DMM 173.4.2 excludes
                                         # periodicals) — those ship ground.
    fulfillment_policy_id_local_pickup: null  # optional: local-pickup-only policy;
                                         # used for ship-risky items (fragile/over-
                                         # sized) marked fulfillment_mode LOCAL_PICKUP.
                                         # Create via `--create-pickup-policy`.
    fulfillment_policy_id_us_only: null  # optional but REQUIRED to list firearm
                                         # magazines/parts, body armor or night
                                         # vision: a policy whose shipToLocations
                                         # is US only. eBay refuses those publishes
                                         # (errorId 25019, ITAR Part 121) while a
                                         # listing is eBay-International-Shipping
                                         # eligible, and eIS eligibility comes from
                                         # shipToLocations "Worldwide" on the policy
                                         # — NOT from globalShipping and NOT from
                                         # the draft's shipping.international flag.
                                         # Routing is automatic; see lib/us_only.py.
    payment_policy_id: null
    payment_policy_id_auction: null      # optional: a payment policy with immediate
                                         # payment OFF; required for AUCTION offers
                                         # (eBay forbids immediate-pay on auctions).
                                         # Falls back to payment_policy_id if unset.
    return_policy_id: null               # for Top Rated Plus this must be a
                                         # 30-day-or-longer policy with
                                         # returnShippingCostPayer: SELLER.
                                         # See docs/top-rated-plus.md.

  # -------------------------------------------------------------------------
  # Additional eBay seller accounts (GH #147) — connect to more than one
  # store at once, e.g. a secondary "junk" store for cheap, as-is, no-returns
  # lots you don't want mixed in with your main store's listings.
  #
  # Unlike sandbox:/production: above (two environments of the SAME account),
  # each block under `stores:` is its OWN seller account: its own keyset,
  # refresh token, business policies, and merchant location. `environment`
  # here applies to just that one store, and every field is flat (no nested
  # sandbox:/production: split) — a name like "junk" already picks one real
  # account, so there's nothing left to pick with a second axis.
  #
  # Use it with:
  #   python list_edit.py --store junk --setup-check   # verify + list that
  #                                                     # account's policy IDs
  #   python list_edit.py --list <shoot> --store junk --confirm
  # ...or, to avoid typing --store on every command, add `store: "junk"` to
  # that item's draft.md frontmatter — --review/--sync/--publish/--list all
  # read it automatically when --store isn't given (CLI flag still wins).
  # The active store, if you don't want to pass --store at all, can also be
  # set globally with `active_store: "junk"` below, or the EBAYBIZ_STORE
  # env var (precedence: --store > EBAYBIZ_STORE > active_store > "default").
  #
  # The account without a name here — ebay.environment/sandbox/production
  # above — is always reachable too, as the implicit store "default".
  # active_store: "default"
  stores:
    junk:
      environment: "production"
      app_id: "PRD-junk-app-id"
      cert_id: "PRD-junk-cert-id"
      dev_id: "PRD-junk-dev-id"
      redirect_uri: "PRD-junk-RuName"
      user_refresh_token: null
      merchant_location_key: null
      fulfillment_policy_id: null
      fulfillment_policy_id_media: null
      fulfillment_policy_id_local_pickup: null
      fulfillment_policy_id_international: null
      fulfillment_policy_id_us_only: null
      payment_policy_id: null
      payment_policy_id_auction: null
      return_policy_id: null

# ---------------------------------------------------------------------------
# EasyPost — self-serve carrier-rate API for buying shipping labels (GH #80)
# ---------------------------------------------------------------------------
# Bypasses eBay's own Logistics API (confirmed a dead end for a small
# seller — Limited Release, invitation-only, USPS-only; see #32/#80).
# Rate quoting (lib/easypost_client.get_rates) runs freely and costs
# nothing. Buying a label (lib/easypost_client.buy_label /
# `ebz ship-buy`) spends real money and is DRY RUN unless --confirm is
# passed explicitly — same gate as `list_edit.py --publish/--end`.
#
# Setup is a human, one-time step, not something to provision unattended:
#   1. Create an account at https://www.easypost.com and fund its balance.
#   2. Get a key (test or production) at
#      https://www.easypost.com/account/api-keys — a test key never
#      charges a real carrier, useful for exercising ship-quote/ship-buy
#      before trusting it with real postage money.
easypost:
  api_key: "EZAK_REPLACE_ME"

# ---------------------------------------------------------------------------
# CURATE strategy profiles
# ---------------------------------------------------------------------------
# Profiles encode the Buy Point math used by CURATE. The active profile
# applies by default; named profiles can be selected per-run via CLI flag.
#
# Built-in defaults (applied to any profile that omits a field):
#   margin_target:        0.50    (50% — sell for at least 2x buy)
#   buy_point_multiplier: 0.5     (against worst-case sale floor)
#   fee_pct:              0.13    (eBay + payment processing)
#   profit_floor:         100     (USD per item minimum)
#   drive_cost:           0       (per-trip; only factored if set)

active_profile: "default"

profiles:
  default:
    margin_target: 0.50
    buy_point_multiplier: 0.5
    fee_pct: 0.13
    profit_floor: 100
    drive_cost: 0

  # Example: aggressive profile for in-person estate-sale buying within
  # ~25-mile drive radius. Tighter margin, lower floor, accounts for drive.
  estate-sale-25mi:
    margin_target: 0.40
    buy_point_multiplier: 0.45
    profit_floor: 75
    drive_cost: 15      # round-trip cost factored against potential profit

  # Example: online-pickup profile (no drive cost, conservative buy).
  online-no-pickup:
    margin_target: 0.50
    buy_point_multiplier: 0.4
    profit_floor: 100
    drive_cost: 0

  # Example: higher floor for slow-moving categories where you only want
  # high-margin items worth waiting for.
  high-floor:
    profit_floor: 200
    margin_target: 0.60

# ---------------------------------------------------------------------------
# Store identity + the standing close on every listing body.
#
# DRAFT renders `closing_block` VERBATIM as the last section of every
# description (see prompts/draft.md, "Markdown body"). It is boilerplate on
# purpose: a buyer reads it once, and it answers the questions that otherwise
# arrive as messages.
#
# Two rules. Nothing here may be a claim about the ITEM — this block is
# identical on every listing, so anything item-specific is false somewhere.
# And every line must be true of every listing you ship: if one stops being
# true, fix it HERE, never by editing it out of one listing.
#
# Note what is NOT in the default block: the "clean, smoke-free environment"
# line that most estate sellers carry. It is a factual claim about your
# premises. Add it only if it holds for everything you store and ship.
store:
  # The storefront name buyers see, used in the sign-off. Leave EMPTY and
  # DRAFT signs off with the unnamed thank-you rather than inventing a brand.
  display_name: ""

  closing_block: |
    Please message me with any questions before buying — I'd rather answer
    one than have you guess.

    Payment or contact is appreciated within three days so I can keep
    listings moving.

    Thank you for looking, and please take a look at my other listings.

# ---------------------------------------------------------------------------
# Additional storefronts (GH #147) — the BUSINESS behind a second seller
# account, as distinct from `ebay.stores.<name>` above, which is only its
# CREDENTIALS. A second store is usually a different business: its own terms,
# its own voice, its own name on the sign-off. Connecting the account without
# onboarding the business is how a junk listing goes out reading
# "Thank you for looking — <your main store>."
#
# Full runbook: docs/STORE-CONNECTION-README.md
#
# The DEFAULT storefront is the `store:` block above, read in place — NOT
# duplicated here as `storefronts.default`. One fact, one home, and existing
# single-store configs need no migration.
#
# Selection matches credentials, so one `--store junk` picks the account and
# the business together: --store > EBAYBIZ_STORE > ebay.active_store > default.
#
# TWO INHERITANCE RULES, and they differ on purpose:
#
#   * POLICY inherits. Anything a named storefront omits falls through to the
#     default, so an override states only what actually differs — and a
#     policy you have not decided stays visibly undecided instead of being
#     invented.
#   * IDENTITY does NOT. `display_name` and `closing_block` resolve to null
#     for a named storefront that omits them, and DRAFT then ships the
#     unnamed thank-you. Inheriting identity is the bug this exists to
#     prevent; tests/test_storefront.py pins it.
#
# An unknown storefront name is a hard error listing the configured ones —
# never a silent fallback to the main store's name and terms.
#
# storefronts:
#   junk:
#     display_name: null                 # null = unnamed thank-you, never a
#                                        # borrowed brand. A deliberate state,
#                                        # not a blank to fill in.
#     closing_block: |                   # its own — must be true of every
#       Sold as-is. Please look the photos over and message me with any
#       questions before buying.
#
#       Thank you for looking. Please take a look at my other listings.
#
#     returns: "none_as_is"              # what DRAFT writes in the copy. Keep
#                                        # it agreeing with this store's
#                                        # ebay.stores.<name>.return_policy_id,
#                                        # which is what eBay ENFORCES —
#                                        # nothing cross-checks the two.
#     shipping: "buyer_pays_calculated"  # same split: this describes, the
#                                        # fulfillment_policy_id enforces.
#
#     routing: ["as_is", "untested", "damaged"]
#                                        # what belongs here. Prefer CONDITION
#                                        # over value: a cheap but clean,
#                                        # warrantable item still belongs in
#                                        # the main store — a low price is not
#                                        # a defect.
#
#     price_posture: "below_new"         # NOT the house ceiling-first rule.
#                                        # Ceiling-first assumes scarcity sets
#                                        # the price. For goods still sold new
#                                        # that is false: the buyer's
#                                        # alternative is the retail box, with
#                                        # a warranty and a return window. Caps
#                                        # the ask against NEW delivered.
#     new_price_pct: 0.667               # ASK at this fraction of new. A TARGET,
#                                        # not only a ceiling: the ask lands
#                                        # here rather than merely staying under
#                                        # it, so a thin used market cannot drag
#                                        # the price below the retail anchor.
#                                        # (target=True in
#                                        # price_stats.apply_new_price_ceiling.)
#     new_price_ceiling_pct: 0.667       # keep equal to new_price_pct so the
#                                        # target and the cap cannot drift.
#
#     best_offer: false                  # store-wide: no Best Offer anywhere.
#                                        # Enforced by validate_draft_for_sync
#                                        # and NOT waivable per draft — unlike
#                                        # the #140 A1 under-$100 rule, which a
#                                        # meta.notes justification satisfies.
#
#     # Leave a genuinely undecided policy UNSET so it inherits, rather than
#     # guessing a value that later reads as a decision someone made. E.g.
#     # price_posture omitted -> the house ceiling-first rule applies.
