<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Amcrest PTZ</title>
<style>
  body { margin: 0; padding: 8px; background: #1e1f22; color: #e8e8e8;
         font: 14px system-ui, sans-serif; }
  .pad { display: grid; grid-template-columns: repeat(3, 48px); gap: 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; align-items: center; }
  button { min-width: 48px; height: 40px; font-size: 18px; color: #fff;
           background: #3c3f45; border: 1px solid #5a5e66; border-radius: 4px; cursor: pointer; }
  button:hover, button:focus-visible { background: #4f535b; outline: 2px solid #8ab4f8; }
  #stop { background: #8b2e2e; }
  label { display: flex; align-items: center; gap: 4px; }
  #status { margin-top: 8px; min-height: 1.4em; color: #c8c8c8; }
</style>
</head>
<body>
<div class="pad" role="group" aria-label="Pan and tilt">
  <span></span><button data-cmd="up" aria-label="Tilt up">&#9650;</button><span></span>
  <button data-cmd="left" aria-label="Pan left">&#9664;</button>
  <button id="stop" data-cmd="stop" aria-label="Stop">&#9632;</button>
  <button data-cmd="right" aria-label="Pan right">&#9654;</button>
  <span></span><button data-cmd="down" aria-label="Tilt down">&#9660;</button><span></span>
</div>
<div class="row" role="group" aria-label="Presets">
  <button data-preset="1">1</button><button data-preset="2">2</button>
  <button data-preset="3">3</button><button data-preset="4">4</button>
  <label><input type="checkbox" id="save"> Save</label>
</div>
<div class="row">
  <label>Speed <input type="range" id="speed" min="1" max="8" value="4" aria-label="Move speed"></label>
</div>
<div id="status" role="status" aria-live="polite"></div>
<script>
const status = document.getElementById("status");
const save = document.getElementById("save");
async function send(req) {
  status.textContent = "...";
  try {
    const r = await fetch("/ptz", {method: "POST", body: JSON.stringify(req),
      headers: {"Content-Type": "application/json", "X-Amcrest-Dock": "1"}});
    status.textContent = (await r.json()).msg;
  } catch (e) { status.textContent = "dock server not running"; }
}
document.querySelectorAll("[data-cmd]").forEach(b => b.addEventListener("click", () =>
  send({cmd: b.dataset.cmd, speed: +document.getElementById("speed").value})));
document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
  send({cmd: save.checked ? "save" : "goto", n: +b.dataset.preset});
  save.checked = false;
}));
</script>
</body>
</html>
