# ebaybiz V2 — config.example.yaml
#
# Copy this file to:
#   Windows:        %APPDATA%\ebaybiz\config.yaml
#   macOS / Linux:  ~/.ebaybiz/config.yaml
#
# Then edit the values below. Every section is optional — missing values
# fall back to the corresponding environment variable, then to a built-in
# default where one exists.
#
# Precedence for any setting (highest wins):
#   1. Explicit function argument (in code)
#   2. Environment variable (when applicable)
#   3. This config file
#   4. Built-in default

# ---------------------------------------------------------------------------
# Apify — eBay sold-listings scraping backend (Source B of PRICE)
# ---------------------------------------------------------------------------
apify:
  # Required for PRICE's Source B to work.
  # Get a token at: https://console.apify.com/account/integrations
  api_token: "apify_api_REPLACE_ME"

  # Optional. Which Apify Actor to call for eBay scraping.
  # The default actor below is widely used; override only if you've
  # found one that returns cleaner data or costs less per call.
  ebay_actor: "caffein.dev/ebay-sold-listings"

# ---------------------------------------------------------------------------
# Anthropic — Claude API (for IDENTIFY / INVESTIGATE / PRICE / CURATE)
# ---------------------------------------------------------------------------
anthropic:
  # Required for any function that calls Claude.
  # Get a key at: https://console.anthropic.com/settings/keys
  api_key: "sk-ant-REPLACE_ME"

# ---------------------------------------------------------------------------
# eBay Sell API — credentials for DRAFT (publish listings) + schema discovery
# ---------------------------------------------------------------------------
# Register an eBay developer account and create a keyset at:
#   https://developer.ebay.com/my/keys
#
# Each keyset is environment-specific. Most workflows:
#   1. Create a Sandbox keyset first (no risk, fake data)
#   2. Use it for development / DRAFT iteration
#   3. Apply for Production keys when ready to publish real listings
#
# The dev_id field is only needed for legacy XML-API calls; REST APIs (which
# V2 uses) only need app_id + cert_id.
#
# redirect_uri is required for the user-consent OAuth flow (needed before
# you can write listings — Sell Inventory API requires user-context tokens).
# Set this to the "RuName" or redirect URL you register at developer.ebay.com.
ebay:
  # sandbox (recommended for development) or production
  environment: "sandbox"

  # From https://developer.ebay.com/my/keys
  app_id: "REPLACE_ME-PRD-OR-SBX-app-id"
  cert_id: "PRD-OR-SBX-cert-id-REPLACE_ME"

  # Optional (legacy XML API only — REST API doesn't need this)
  dev_id: null

  # Required for user-context OAuth (writes). The redirect URL registered
  # with your eBay app at https://developer.ebay.com/my/auth-n-auth
  redirect_uri: null

  # Captured from the user-consent flow:
  #   1. python ebay_client.py --user-consent-url
  #   2. Visit URL, sign in, authorize
  #   3. python ebay_client.py --exchange-code <code-from-callback>
  #   4. Paste the printed refresh_token here
  user_refresh_token: null

# ---------------------------------------------------------------------------
# CURATE strategy profiles
# ---------------------------------------------------------------------------
# Profiles encode the Buy Point math used by CURATE. The active profile
# applies by default; named profiles can be selected per-run via CLI flag.
#
# Built-in defaults (applied to any profile that omits a field):
#   margin_target:        0.50    (50% — sell for at least 2x buy)
#   buy_point_multiplier: 0.5     (against worst-case sale floor)
#   fee_pct:              0.13    (eBay + payment processing)
#   profit_floor:         100     (USD per item minimum)
#   drive_cost:           0       (per-trip; only factored if set)

active_profile: "default"

profiles:
  default:
    margin_target: 0.50
    buy_point_multiplier: 0.5
    fee_pct: 0.13
    profit_floor: 100
    drive_cost: 0

  # Example: aggressive profile for in-person estate-sale buying within
  # ~25-mile drive radius. Tighter margin, lower floor, accounts for drive.
  estate-sale-25mi:
    margin_target: 0.40
    buy_point_multiplier: 0.45
    profit_floor: 75
    drive_cost: 15      # round-trip cost factored against potential profit

  # Example: online-pickup profile (no drive cost, conservative buy).
  online-no-pickup:
    margin_target: 0.50
    buy_point_multiplier: 0.4
    profit_floor: 100
    drive_cost: 0

  # Example: higher floor for slow-moving categories where you only want
  # high-margin items worth waiting for.
  high-floor:
    profit_floor: 200
    margin_target: 0.60
